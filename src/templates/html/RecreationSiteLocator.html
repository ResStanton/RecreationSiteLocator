<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RecreationSiteLocator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .browser-header {
      background: #ccc;
      padding: 10px;
      display: flex;
      align-items: center;
    }
    .nav-buttons {
      margin-right: 10px;
    }
    .nav-buttons button {
      margin-right: 5px;
    }
    .address-bar {
      flex: 1;
    }
    .search-bar {
      display: flex;
      padding: 10px;
      background: #eee;
      align-items: center;
    }
    .search-bar input[type="text"] {
      flex: 1;
      padding: 5px;
    }
    .search-bar select, .search-bar button {
      margin-left: 10px;
      padding: 5px;
    }
    .main-container {
      display: flex;
      height: calc(100vh - 100px);
    }
    .sidebar {
      width: 250px;
      background: #f4f4f4;
      padding: 10px;
      overflow-y: auto;
      border-right: 1px solid #ccc;
    }
    .sidebar label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }
    .sidebar div {
      border-bottom: 1px solid #ccc;
      padding-bottom: 10px;
    }
    .map-view {
      flex: 1;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .map-view img {
      max-width: 100%;
      max-height: 100%;
    }
  </style>
</head>
<body>

  <div class="browser-header">
    <div class="nav-buttons">
      <button>&larr;</button>
      <button>&crarr;</button>
    </div>
    <input class="address-bar" type="text" placeholder="Enter URL or search here...">
  </div>

  <div class="search-bar">
    <input type="text" placeholder="Search...">
    <button>Search</button>
    <select>
      <option>Search Type</option>
    </select>
    <select>
      <option>Filter By</option>
    </select>
  </div>

  <div class="main-container">
    <div class="sidebar">
      <label>Name:</label>
      <div>_______________________</div>

      <label>Activity:</label>
      <div>_______________________</div>

      <label>Description:</label>
      <div>_______________________<br>_______________________<br>_______________________</div>

      <label>Hours:</label>
      <div>_______________________</div>

      <label>Fees:</label>
      <div>_______________________</div>

      <label>Restrictions:</label>
      <div>_______________________</div>
    </div>

    <div class="map-view">
      <img src="USMAP.jpg" alt="World Map">
    </div>
  </div>

</body>
</html>
